<!DOCTYPE html>
<html lang="es">
<head>
    <title>ShadowApp 🚗❄️</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
    <style>
        :root { --glass: rgba(15, 23, 42, 0.88); --accent: #e94560; }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* ── HUD SUPERIOR ─────────────────────────────── */
        .hud-top {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; z-index: 10;
        }

        /* ── HUD INFERIOR ─────────────────────────────── */
        .hud-bottom {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 500px; z-index: 10;
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 22px 22px 18px; border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* ── PÍLDORAS DE CRISTAL ──────────────────────── */
        .glass-pill {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 10px 16px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.12);
            color: white; font-size: 13px;
            display: flex; align-items: center; gap: 7px;
            white-space: nowrap;
        }
        input[type="date"] {
            background: transparent; border: none; color: white;
            font-family: inherit; font-size: 13px; outline: none; width: 130px;
        }

        /* ── DISPLAY DE HORA ──────────────────────────── */
        .time-display {
            font-size: 42px; font-weight: 800; display: block;
            letter-spacing: -1px; line-height: 1;
        }
        .sun-details {
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            opacity: 0.5; margin: 6px 0 4px; display: block;
        }

        /* ── SLIDER ───────────────────────────────────── */
        input[type=range] {
            width: 100%; -webkit-appearance: none; background: transparent; margin: 14px 0 8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
            background: var(--accent); cursor: pointer; margin-top: -10px;
            box-shadow: 0 0 18px var(--accent); border: 3px solid white;
        }

        /* ── FILA DE CAPAS ────────────────────────────── */
        .layer-row {
            display: flex; gap: 8px; justify-content: center; margin: 12px 0;
        }
        .layer-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; color: rgba(255,255,255,0.55);
            padding: 7px 14px; font-size: 12px; cursor: pointer;
            transition: all 0.2s; user-select: none;
        }
        .layer-btn.on-trees  { background: rgba(46,204,113,0.25); border-color: #2ecc71; color: #2ecc71; }
        .layer-btn.on-park   { background: rgba(52,152,219,0.25); border-color: #3498db; color: #3498db; }

        /* ── BOTÓN APARCAR ────────────────────────────── */
        .btn-park {
            background: var(--accent); border: none; padding: 15px;
            border-radius: 18px; color: white; font-weight: 700; width: 100%;
            cursor: pointer; font-size: 15px; transition: all 0.25s;
            letter-spacing: 0.3px;
        }
        .btn-park:active { transform: scale(0.97); }
        .btn-park.parked { background: #27ae60; }

        /* ── POPUP DEL COCHE ──────────────────────────── */
        .maplibregl-popup-content {
            background: var(--glass) !important; color: white !important;
            border-radius: 12px !important; padding: 10px 14px !important;
            font-size: 13px;
        }

        .maplibregl-ctrl-attrib { display: none; }
        .maplibregl-ctrl-logo   { display: none !important; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- HUD superior -->
<div class="hud-top">
    <div class="glass-pill">
        📅 <input type="date" id="date-picker">
    </div>
    <div class="glass-pill" id="status-tag">☀️ Despejado</div>
</div>

<!-- HUD inferior -->
<div class="hud-bottom">
    <span class="sun-details" id="sun-angle">ELEVACIÓN DEL SOL: --°</span>
    <span class="time-display" id="time-txt">12:00</span>
    <input type="range" id="hour-slider" min="0" max="23.9" value="12" step="0.1">

    <!-- Toggle de capas -->
    <div class="layer-row">
        <div class="layer-btn" id="btn-trees"   onclick="toggleLayer('trees')">🌳 Vegetación</div>
        <div class="layer-btn on-park" id="btn-park-layer" onclick="toggleLayer('parking')">🅿️ Parking cubierto</div>
    </div>

    <button class="btn-park" id="btn-park" onclick="toggleCar()">📍 FIJAR POSICIÓN DEL COCHE</button>
</div>

<script>
    // ── ESTADO GLOBAL ──────────────────────────────────────
    let map;
    let userPos    = { lat: 41.6176, lon: 0.6201 }; // Lleida (fallback)
    let carMarker  = null;
    let layerOn    = { trees: false, parking: true };

    const slider      = document.getElementById('hour-slider');
    const datePicker  = document.getElementById('date-picker');
    const timeTxt     = document.getElementById('time-txt');
    const sunAngleTag = document.getElementById('sun-angle');
    const statusTag   = document.getElementById('status-tag');
    const btnPark     = document.getElementById('btn-park');

    // Fecha de hoy por defecto
    datePicker.value = new Date().toISOString().split('T')[0];

    // ── INICIALIZACIÓN DEL MAPA ────────────────────────────
    function init() {
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [userPos.lon, userPos.lat],
            zoom: 17.5,
            pitch: 65,
            bearing: 0,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        map.on('load', () => {

            // 1️⃣  SOMBRAS DE EDIFICIOS (capa plana desplazada)
            map.addLayer({
                id: 'shadows',
                source: 'openmaptiles',
                'source-layer': 'building',
                type: 'fill-extrusion',
                paint: {
                    'fill-extrusion-color': '#000000',
                    'fill-extrusion-opacity': 0.5,
                    'fill-extrusion-height': 0.1,
                    'fill-extrusion-base': 0
                }
            });

            // 2️⃣  EDIFICIOS 3D
            map.addLayer({
                id: 'buildings',
                source: 'openmaptiles',
                'source-layer': 'building',
                type: 'fill-extrusion',
                paint: {
                    'fill-extrusion-color': '#2d3748',
                    'fill-extrusion-height': ['coalesce', ['get', 'height'], 15],
                    'fill-extrusion-base':   ['coalesce', ['get', 'min_height'], 0],
                    'fill-extrusion-opacity': 0.9
                }
            });

            // 3️⃣  ZONAS VERDES / VEGETACIÓN (sombra difusa verde)
            map.addLayer({
                id: 'trees',
                source: 'openmaptiles',
                'source-layer': 'landcover',
                filter: ['in', ['get', 'class'], ['literal', ['wood', 'grass', 'scrub']]],
                type: 'fill',
                paint: {
                    'fill-color': '#2ecc71',
                    'fill-opacity': 0.35
                }
            });

            // 4️⃣  PARKINGS CUBIERTOS / ESTRUCTURAS DE APARCAMIENTO
            //     En OSM: amenity=parking con covered=yes, parking=multi-storey o underground
            map.addLayer({
                id: 'parking-covered',
                source: 'openmaptiles',
                'source-layer': 'landuse',
                filter: ['==', ['get', 'class'], 'parking'],
                type: 'fill',
                paint: {
                    'fill-color': '#3498db',
                    'fill-opacity': 0.55,
                    'fill-outline-color': '#2980b9'
                }
            });

            // Etiqueta encima de los parkings
            map.addLayer({
                id: 'parking-label',
                source: 'openmaptiles',
                'source-layer': 'poi',
                filter: ['==', ['get', 'class'], 'parking'],
                type: 'symbol',
                layout: {
                    'text-field': '🅿️',
                    'text-size': 16,
                    'text-anchor': 'center'
                }
            });

            // Visibilidad inicial según layerOn
            map.setLayoutProperty('trees',          'visibility', layerOn.trees   ? 'visible' : 'none');
            map.setLayoutProperty('parking-covered','visibility', layerOn.parking ? 'visible' : 'none');
            map.setLayoutProperty('parking-label',  'visibility', layerOn.parking ? 'visible' : 'none');

            // Recuperar coche guardado
            restoreCar();
            update();
        });

        slider.addEventListener('input', update);
        datePicker.addEventListener('change', update);
    }

    // ── CÁLCULO DE SOMBRAS ─────────────────────────────────
    function update() {
        // Construir fecha+hora desde los controles
        const [y, m, d] = datePicker.value.split('-').map(Number);
        const hours   = Math.floor(parseFloat(slider.value));
        const minutes = Math.round((parseFloat(slider.value) - hours) * 60);
        const t = new Date(y, m - 1, d, hours, minutes, 0);

        const sun = SunCalc.getPosition(t, userPos.lat, userPos.lon);
        const alt = sun.altitude * (180 / Math.PI);

        // UI texto
        timeTxt.innerText = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        sunAngleTag.innerText = `ELEVACIÓN DEL SOL: ${alt.toFixed(1)}°`;

        if (alt > 0) {
            // Longitud de sombra: L = H · cot(α)  — limitada para evitar infinito al amanecer
            const shadowLen   = Math.min(1 / Math.tan(sun.altitude), 6);
            const zoomAdjust  = Math.pow(2, 17.5 - map.getZoom());
            const mult        = 14 * zoomAdjust;
            const dx = Math.sin(sun.azimuth) * shadowLen * mult;
            const dy = Math.cos(sun.azimuth) * shadowLen * mult;

            map.setPaintProperty('shadows', 'fill-extrusion-opacity', 0.55);
            map.setPaintProperty('shadows', 'fill-extrusion-translate', [dx, dy]);

            const light = Math.max(40, Math.min(185, alt * 4));
            map.setPaintProperty('buildings', 'fill-extrusion-color',
                `rgb(${light}, ${light + 5}, ${light + 22})`);

            statusTag.innerText = alt > 35 ? '☀️ Sol alto' : '🌤 Sol bajo';
        } else {
            map.setPaintProperty('shadows', 'fill-extrusion-opacity', 0);
            map.setPaintProperty('buildings', 'fill-extrusion-color', '#10141d');
            statusTag.innerText = '🌙 Noche';
        }
    }

    // ── TOGGLE DE CAPAS ────────────────────────────────────
    function toggleLayer(layer) {
        layerOn[layer] = !layerOn[layer];

        if (layer === 'trees') {
            map.setLayoutProperty('trees', 'visibility', layerOn.trees ? 'visible' : 'none');
            const btn = document.getElementById('btn-trees');
            btn.className = 'layer-btn' + (layerOn.trees ? ' on-trees' : '');

        } else if (layer === 'parking') {
            const vis = layerOn.parking ? 'visible' : 'none';
            map.setLayoutProperty('parking-covered', 'visibility', vis);
            map.setLayoutProperty('parking-label',   'visibility', vis);
            const btn = document.getElementById('btn-park-layer');
            btn.className = 'layer-btn' + (layerOn.parking ? ' on-park' : '');
        }
    }

    // ── MARCADOR DEL COCHE ─────────────────────────────────
    function toggleCar() {
        if (carMarker) {
            carMarker.remove();
            carMarker = null;
            localStorage.removeItem('shadowapp_car');
            btnPark.textContent = '📍 FIJAR POSICIÓN DEL COCHE';
            btnPark.classList.remove('parked');
        } else {
            const c = map.getCenter();
            placeCar(c.lng, c.lat, true);
        }
    }

    function placeCar(lng, lat, save = false) {
        if (carMarker) carMarker.remove();

        carMarker = new maplibregl.Marker({ color: '#e94560', draggable: true })
            .setLngLat([lng, lat])
            .setPopup(
                new maplibregl.Popup({ offset: 25 })
                    .setHTML('<strong>🚗 Tu coche</strong><br><small>Arrastra para ajustar la posición</small>')
            )
            .addTo(map);

        // Guardar al arrastrar
        carMarker.on('dragend', () => {
            const p = carMarker.getLngLat();
            localStorage.setItem('shadowapp_car', JSON.stringify({ lng: p.lng, lat: p.lat }));
        });

        if (save) {
            localStorage.setItem('shadowapp_car', JSON.stringify({ lng, lat }));
        }

        btnPark.textContent = '❌ QUITAR MARCADOR DEL COCHE';
        btnPark.classList.add('parked');
    }

    function restoreCar() {
        const saved = localStorage.getItem('shadowapp_car');
        if (saved) {
            try {
                const { lng, lat } = JSON.parse(saved);
                placeCar(lng, lat, false);
            } catch (e) {
                localStorage.removeItem('shadowapp_car');
            }
        }
    }

    // ── ARRANQUE ───────────────────────────────────────────
    navigator.geolocation.getCurrentPosition(
        p => {
            userPos = { lat: p.coords.latitude, lon: p.coords.longitude };
            init();
        },
        () => init(),
        { timeout: 8000 }
    );
</script>
</body>
</html>
